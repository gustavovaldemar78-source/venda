<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="currentColor">
  <!-- Monograma J cursivo elegante e fluido -->
  <defs>
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C325E" />
      <stop offset="100%" stop-color="#7A1F45" />
    </linearGradient>
  </defs>
  <!-- Laço superior suave -->
  <path d="M 125 35 
           C 145 25, 170 32, 168 52 
           C 166 70, 138 78, 115 82 
           C 92 86, 68 85, 52 75 
           C 40 68, 42 55, 58 48 
           C 78 40, 112 42, 135 45" 
        stroke="url(#monogramGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Haste principal sinuosa descendo até a curva inferior do J -->
  <path d="M 128 42 
           C 120 75, 110 115, 100 148 
           C 92 174, 80 188, 62 188 
           C 44 188, 32 172, 34 152 
           C 36 126, 60 108, 92 104 
           C 118 100, 142 110, 160 125" 
        stroke="url(#monogramGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Delicado traço de adorno fluido -->
  <path d="M 102 140 
           C 125 152, 150 162, 172 165" 
        stroke="url(#monogramGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none" />
</svg>
